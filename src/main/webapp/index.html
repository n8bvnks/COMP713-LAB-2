<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1">
<title>Greeting lifecycle</title>
</head>

<body>

<h1>End-to-end greeting</h1>

<form id="greeting-form">
<label>
Name:
<input id="name" name="name">
</label>

<button type="submit">Send request</button>
</form>

<p>Status: <span id="status">Waiting</span></p>

<pre id="output"></pre>


<script>

const form =
document.querySelector("#greeting-form");

const status =
document.querySelector("#status");

const output =
document.querySelector("#output");


form.addEventListener(
"submit",
async (event) => {

event.preventDefault();


const name =
document
.querySelector("#name")
.value;


console.log("1. Form submitted");


const requestBody = {
    name: name
};


console.log(
"2. JavaScript object created",
requestBody
);


status.textContent =
"Sending request...";


try {

const response =
await fetch("api/greeting", {

method: "POST",

headers: {
"Content-Type":
"application/json"
},

// TODO 1:
// Convert requestBody into JSON text.
body: JSON.stringify(requestBody)

});


console.log(
"7. HTTP response received",
response.status
);


// TODO 2:
// Read the response body as JSON.
const data = await response.json();


status.textContent =
response.status.toString();


// TODO 3:
// Display data.message for success
// and data.error for failure.
if(response.ok){

    output.textContent =
    data.message;

}
else{

    output.textContent =
    data.error;

}


} catch (error) {


status.textContent =
"Network error";


output.textContent =
error.message;


}

}

);

</script>

</body>
</html>
